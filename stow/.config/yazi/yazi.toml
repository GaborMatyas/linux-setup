# Yazi configuration for Bazzite - Video files open with VLC

[opener]
play = [
    { run = 'flatpak run com.videolan.VLC "$@"', orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    # Video and audio files use VLC
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]